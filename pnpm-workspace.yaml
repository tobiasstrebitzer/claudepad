packages:
  - 'apps/*'
  - 'packages/*'

# Hoist nothing surprising; keep the tree auditable for the zero-dep crypto
# posture. (Moved from the formerly tracked .npmrc, which is gitignored now so
# a local auth token can never land in git.)
autoInstallPeers: true
strictPeerDependencies: false

# esbuild ships a platform binary via its install script; Vite + Vitest need it.
# workerd is wrangler's runtime. sharp is only wrangler's optional image-transform
# dep for local dev - we never use it, so its native build stays off (it would
# otherwise fail-hard on source builds and abort the whole install).
allowBuilds:
  esbuild: true
  sharp: false
  workerd: true
